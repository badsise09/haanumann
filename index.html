<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bada Hanuman Mandir</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
  }

  /* NAVBAR */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: black;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    z-index: 1000;
  }

  nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
  }

  /* SECTIONS */
  section {
    height: 100vh;
    padding-top: 80px;
    text-align: center;
  }

  #home { background: orange; }
  #about { background: lightblue; }
  #timings { background: lightgreen; }
  #festivals { background: pink; }
  #gallery { background: lightgray; }
  #contact { background: lightyellow; }

<body>

<!-- NAV -->
<nav>
  <a href="#home">Home</a>
  <a href="#about">About</a>
  <a href="#timings">Darshan</a>
  <a href="#festivals">Festivals</a>
  <a href="#gallery">Gallery</a>
  <a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<section id="home">
  <h1>Bada Hanuman Mandir</h1>
  <p>Welcome to the temple</p>
</section>

<!-- ABOUT -->
<section id="about">
  <h1>About</h1>
  <p>Information about temple</p>
</section>

<!-- TIMINGS -->
<section id="timings">
  <h1>Darshan Timings</h1>
  <p>Morning & Evening</p>
</section>

<!-- FESTIVALS -->
<section id="festivals">
  <h1>Festivals</h1>
  <p>Hanuman Jayanti, Diwali</p>
</section>

<!-- GALLERY -->
<section id="gallery">
  <h1>Gallery</h1>
</section>

<!-- CONTACT -->
<section id="contact">
  <h1>Contact</h1>
</section>

</body>
</html>
